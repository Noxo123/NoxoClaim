name: Build NoxoClaim

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 26.2
            paper-api: 26.2.build.+
          - name: Paper 26.1.2
            paper-api: 26.1.2.build.+

    name: Build — ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: gradle

      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.0'
          validate-wrappers: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build and test
        run: gradle --no-daemon --stacktrace clean test build -PpaperApiVersion="${{ matrix.paper-api }}" -PnoxoclaimCommit="${{ github.sha }}"

      - name: Upload plugin artifact
        if: success() && matrix.paper-api == '26.2.build.+'
        uses: actions/upload-artifact@v4
        with:
          name: NoxoClaim
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish nightly update
        if: success() && github.event_name == 'push' && matrix.paper-api == '26.2.build.+'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: NoxoClaim Nightly
          body: |
            Build automatique du commit ${{ github.sha }}.
            Cette release est utilisée par le système de mise à jour automatique de NoxoClaim.
          prerelease: false
          make_latest: false
          files: build/libs/*.jar
          overwrite_files: true
          target_commitish: ${{ github.sha }}
