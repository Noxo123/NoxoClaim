name: Build NoxoClaim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noxoclaim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 26.2
            paper-api: 26.2.build.+
          - name: Paper 26.1.2
            paper-api: 26.1.2.build.+
    name: Build — ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.0'
          validate-wrappers: false
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Build and test
        run: |
          gradle --no-daemon --stacktrace clean test build \
            -PpaperApiVersion="${{ matrix.paper-api }}" \
            -PnoxoclaimCommit="${{ github.sha }}"
      - name: Verify generated JAR
        run: |
          set -e
          ls -lah build/libs/
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
      - name: Publish immutable commit release
        if: success() && github.event_name == 'push' && matrix.paper-api == '26.2.build.+'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.sha }}"
          name: "NoxoClaim Build ${{ github.sha }}"
          body: |
            Build automatique de NoxoClaim.

            Commit : ${{ github.sha }}
            Branche : main
            Paper : 26.2

            Cette release correspond exactement à ce commit.
            Elle est utilisée par le système de mise à jour automatique de NoxoClaim.
          prerelease: true
          make_latest: false
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
