name: Build NoxoClaim

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Paper 26.2
            paper-api: 26.2.build.+
          - name: Paper 26.1.2
            paper-api: 26.1.2.build.+

    name: Build — ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: gradle

      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7.0'
          validate-wrappers: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build and test
        run: gradle --no-daemon --stacktrace clean test build -PpaperApiVersion="${{ matrix.paper-api }}"

      - name: Upload plugin
        if: success() && matrix.paper-api == '26.2.build.+'
        uses: actions/upload-artifact@v4
        with:
          name: NoxoClaim
          path: build/libs/*.jar
          if-no-files-found: error
