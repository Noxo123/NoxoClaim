name: Build NoxoClaim

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Gradle 8.14.x cannot run on Java 25 (class-file major 69).
      # Java 24 runs Gradle; Java 25 remains the compilation toolchain.
      - name: Setup Java 24 (Gradle runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          architecture: x64

      - name: Setup Java 25 (compilation toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64

      - name: Run Gradle with Java 24
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_24_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "Gradle runtime: $JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          gradle --no-daemon clean test build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NoxoClaim
          path: build/libs/*.jar
