name: Build NoxoClaim

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          validate-wrappers: false

      - name: Build and test
        run: gradle --no-daemon clean test build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NoxoClaim
          path: build/libs/*.jar
