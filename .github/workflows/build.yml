name: Build NoxoClaim

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: gradle

      # Gradle 9.7 is required to run Gradle itself on Java 25.
      - name: Setup Gradle 9.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.7'
          validate-wrappers: false

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build and test
        run: gradle --no-daemon --stacktrace clean test build

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoxoClaim
          path: build/libs/*.jar
          if-no-files-found: error
