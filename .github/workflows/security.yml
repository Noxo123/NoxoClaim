name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  GRADLE_VERSION: "9.7.0"

jobs:
  gradle-dependencies:
    name: Gradle dependency verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Verify Gradle version
        run: gradle --version

      - name: Dependency report
        run: gradle --no-daemon dependencies --configuration runtimeClasspath

      - name: Run tests
        run: gradle --no-daemon clean test

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Verify Gradle version
        run: gradle --version

      - name: Build
        run: gradle --no-daemon clean build -x test

      - name: Analyze
        uses: github/codeql-action/analyze@v4
