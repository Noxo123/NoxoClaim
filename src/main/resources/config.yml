claim:
  max-per-player: 10
  auto-claim:
    enabled: true
    permission: noxoclaim.autoclaim
    first-only: false
  default-flags:
    pvp: false
    explosions: false
    fire: false
    mob-griefing: false
    entry: true

economy:
  enabled: true
  cost-per-chunk: 500.0

teleport:
  delay-seconds: 3
  cancel-on-move: true

effects:
  particles:
    enabled: true
    type: END_ROD
    duration-ticks: 100
    interval-ticks: 10
    step: 1.0
    radius-view-distance: 16
  welcome-title:
    enabled: true
    title: "§b§lBienvenue !"
    subtitle: "§7Bienvenue dans le territoire de §f%owner%§7 !"
    fade-in: 10
    stay: 40
    fade-out: 15

map:
  visual-radius: 16
  visual-duration-ticks: 100
  particles:
    type: END_ROD

storage:
  file: claims.yml
  autosave-seconds: 300

updates:
  enabled: true
  check-on-startup: true
  check-interval-hours: 1
  auto-update: true
  notify-console: true
  notify-admins: true
