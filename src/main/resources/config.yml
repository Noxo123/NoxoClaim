claim:
  max-per-player: 10
  default-flags:
    pvp: false
    explosions: false
    fire: false
    mob-griefing: false
    entry: true

economy:
  enabled: true
  cost-per-chunk: 500.0

teleport:
  delay-seconds: 3
  cancel-on-move: true

effects:
  particles:
    enabled: true
    type: HAPPY_VILLAGER
    duration-ticks: 80
  welcome-title:
    enabled: true
    title: "§b§lBienvenue !"
    subtitle: "§7Ce chunk vous appartient maintenant ✨"
    fade-in: 10
    stay: 50
    fade-out: 15

storage:
  file: claims.yml
  autosave-seconds: 300

updates:
  enabled: true
  check-on-startup: true
  check-interval-hours: 6
  notify-console: true
  notify-admins: true
