claim:
  max-per-player: 10
  auto-claim:
    enabled: true
    permission: noxoclaim.autoclaim
    first-only: false
  default-flags:
    pvp: false
    explosions: false
    fire: false
    mob-griefing: false
    fluids: false
    entry: true
  protection:
    blocks: true
    containers: true
    doors: true
    buttons: true
    redstone: true
    entities: true
    projectiles: true
    pistons: true
  limits:
    allow-adjacent: true
    allow-overlap: false

economy:
  enabled: true
  cost-per-chunk: 500.0

teleport:
  delay-seconds: 3
  cancel-on-move: true

effects:
  particles:
    enabled: true
    type: END_ROD
    duration-ticks: 100
    interval-ticks: 10
    step: 1.0
    radius-view-distance: 64
  welcome-title:
    enabled: true
    title: "§b§lBienvenue !"
    subtitle: "§7Bienvenue dans le territoire de §f%owner%§7 !"
    fade-in: 10
    stay: 40
    fade-out: 15

map:
  visual-radius: 32
  max-visual-radius: 64
  visual-duration-ticks: 120
  particles:
    type: END_ROD

hudengine:
  enabled: true
  auto-install: true
  minimap:
    enabled: true
    hud-key: noxoclaim:minimap
    radius: 4
    refresh-ticks: 20

api:
  enabled: false
  host: 127.0.0.1
  port: 8765
  # Set a long random token before enabling the API.
  token: ""
  rate-limit-per-minute: 120
  webhooks:
    enabled: false
    url: ""
    # Secret sent as X-NoxoClaim-Webhook for generic HTTP webhooks.
    secret: ""
    # HTTP webhooks are disabled by default. HTTPS is recommended.
    allow-http: false
    discord:
      enabled: false
      # Paste your Discord webhook URL here. Do not commit a real secret URL publicly.
      url: ""
      username: "NoxoClaim"
      avatar: ""
      color: "5865F2"

storage:
  file: claims.yml
  autosave-seconds: 300
  backups: true
  backup-count: 5

updates:
  enabled: true
  check-on-startup: true
  check-interval-hours: 1
  auto-update: true
  verify-sha256: true
  notify-console: true
  notify-admins: true
  download-timeout-seconds: 120

plugman:
  enabled: true
  auto-detect: true
