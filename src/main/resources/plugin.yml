name: NoxoClaim
version: 1.1.2
main: fr.noxodev.noxoclaim.NoxoClaim
api-version: '26.1'
author: NoxoDEV
description: Système de claims par chunks pour Paper 26.1 et 26.2.
softdepend:
  - Vault
commands:
  claim:
    description: Gestion des claims
    usage: /claim <wand|create|delete|info|trust|untrust|flags|list|gui|home|sethome>
  chome:
    description: Se téléporter à un claim nommé
    usage: /chome <nom|list>
  claimadmin:
    description: Administration des claims
    usage: /claimadmin <list|delete>
    permission: noxoclaim.admin
permissions:
  noxoclaim.admin: { default: op }
  noxoclaim.bypass: { default: op }
