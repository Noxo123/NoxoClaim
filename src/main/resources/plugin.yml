name: NoxoClaim
version: 2.0.1
main: fr.noxodev.noxoclaim.NoxoClaim
api-version: '26.1'
author: NoxoDEV
description: Système professionnel de protection et gestion de claims pour Paper.
website: https://github.com/Noxo123/NoxoClaim
softdepend:
  - Vault
  - LuckPerms
commands:
  claim:
    description: Gère les claims et ouvre les interfaces NoxoClaim
    usage: /claim [menu|map|voir|list|info|flags|trust|untrust|sethome|home|unclaim]
    aliases: [claims]
  hclaim:
    description: Alias de gestion NoxoClaim
    usage: /hclaim [menu|map|voir|list|info|flags|trust|untrust|sethome|home|unclaim]
  uclaim:
    description: Retire le claim actuel
    usage: /uclaim
  map:
    description: Ouvre la carte NoxoClaim
    usage: /map
  chome:
    description: Gère les homes de claims
    usage: /chome <nom|list>
  claimadmin:
    description: Administration NoxoClaim
    usage: /claimadmin <list|delete|deleteall|save|reload|update>
    permission: noxoclaim.admin
permissions:
  noxoclaim.admin:
    description: Accès complet à NoxoClaim
    default: op
  noxoclaim.bypass:
    description: Ignore les protections NoxoClaim
    default: op
  noxoclaim.claim:
    description: Autorise le joueur à créer un claim
    default: false
  noxoclaim.autoclaim:
    description: Autorise le joueur à bénéficier du claim automatique
    default: false
